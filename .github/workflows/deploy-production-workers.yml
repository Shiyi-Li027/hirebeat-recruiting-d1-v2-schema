name: Deploy production Workers

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY PRODUCTION WORKERS to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hirebeat-production-workers
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production Worker deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require main branch and explicit confirmation
        env:
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployment is restricted to main."
            exit 1
          fi

          if [[ "$DEPLOYMENT_CONFIRMATION" != "DEPLOY PRODUCTION WORKERS" ]]; then
            echo "Production confirmation text did not match."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository validation
        run: npm test

      - name: Validate production configuration isolation
        run: npm run production:config:validate

  deploy-production-workers:
    name: Deploy production Ingress and ETL Workers
    needs: preflight
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate protected production settings
        env:
          PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          PRODUCTION_SUBMISSION_UUID_NAMESPACE: ${{ vars.PRODUCTION_SUBMISSION_UUID_NAMESPACE }}
          PRODUCTION_PARSER_SERVICE_URL: ${{ vars.PRODUCTION_PARSER_SERVICE_URL }}
          PRODUCTION_ML_SERVICE_URL: ${{ vars.PRODUCTION_ML_SERVICE_URL }}
          CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_RUN_INVOKER_JSON: ${{ secrets.CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON_VALUE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PARSER_SERVICE_AUTH_TOKEN_VALUE: ${{ secrets.PARSER_SERVICE_AUTH_TOKEN }}
          ML_SERVICE_AUTH_TOKEN_VALUE: ${{ secrets.ML_SERVICE_AUTH_TOKEN }}
          SUBMISSION_HMAC_KEY_VALUE: ${{ secrets.SUBMISSION_HMAC_KEY_V1 }}
          INGRESS_INTERNAL_AUTH_TOKEN_VALUE: ${{ secrets.INGRESS_INTERNAL_AUTH_TOKEN }}
          IDENTITY_HMAC_KEY_VALUE: ${{ secrets.IDENTITY_HMAC_KEY_V1 }}
          ORCHESTRATOR_INTERNAL_AUTH_TOKEN_VALUE: ${{ secrets.ORCHESTRATOR_INTERNAL_AUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os

          required = [
              "PRODUCTION_D1_DATABASE_ID",
              "PRODUCTION_SUBMISSION_UUID_NAMESPACE",
              "PRODUCTION_PARSER_SERVICE_URL",
              "PRODUCTION_ML_SERVICE_URL",
              "CLOUDFLARE_ACCOUNT_ID_VALUE",
              "CLOUDFLARE_API_TOKEN_VALUE",
              "CLOUD_RUN_INVOKER_JSON",
              "GOOGLE_SERVICE_ACCOUNT_JSON_VALUE",
              "PARSER_SERVICE_AUTH_TOKEN_VALUE",
              "ML_SERVICE_AUTH_TOKEN_VALUE",
              "SUBMISSION_HMAC_KEY_VALUE",
              "INGRESS_INTERNAL_AUTH_TOKEN_VALUE",
              "IDENTITY_HMAC_KEY_VALUE",
              "ORCHESTRATOR_INTERNAL_AUTH_TOKEN_VALUE",
          ]

          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit(
                  "Missing production Environment settings: " + ", ".join(missing)
              )

          print("Protected production settings: PASS")
          PY

      - name: Render production Worker configurations
        env:
          PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          PRODUCTION_SUBMISSION_UUID_NAMESPACE: ${{ vars.PRODUCTION_SUBMISSION_UUID_NAMESPACE }}
          PRODUCTION_PARSER_SERVICE_URL: ${{ vars.PRODUCTION_PARSER_SERVICE_URL }}
          PRODUCTION_ML_SERVICE_URL: ${{ vars.PRODUCTION_ML_SERVICE_URL }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          from urllib.parse import urlparse

          def required(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"Missing production variable: {name}")
              return value

          database_id = required("PRODUCTION_D1_DATABASE_ID")
          namespace = required("PRODUCTION_SUBMISSION_UUID_NAMESPACE")
          parser_url = required("PRODUCTION_PARSER_SERVICE_URL")
          ml_url = required("PRODUCTION_ML_SERVICE_URL")

          uuid_pattern = (
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-"
              r"[0-9a-f]{4}-[0-9a-f]{12}"
          )

          if not re.fullmatch(uuid_pattern, database_id):
              raise SystemExit("Invalid production D1 database ID")

          if not re.fullmatch(uuid_pattern, namespace):
              raise SystemExit("Invalid production submission UUID namespace")

          for label, value in [
              ("Parser", parser_url),
              ("ML", ml_url),
          ]:
              parsed = urlparse(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.netloc.endswith(".run.app")
                  or "stg" in value.lower()
              ):
                  raise SystemExit(f"Invalid production {label} service URL")

          configs = [
              (
                  Path("workers/submission-ingress/wrangler.production.example.toml"),
                  Path("workers/submission-ingress/wrangler.production.toml"),
                  {
                      "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID": database_id,
                      "REPLACE_WITH_PRODUCTION_SUBMISSION_UUID_NAMESPACE": namespace,
                      "REPLACE_WITH_PRIVATE_PRODUCTION_PARSER_SERVICE_URL": parser_url,
                  },
              ),
              (
                  Path("workers/etl-orchestrator/wrangler.production.example.toml"),
                  Path("workers/etl-orchestrator/wrangler.production.toml"),
                  {
                      "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID": database_id,
                      "REPLACE_WITH_PRIVATE_PRODUCTION_ML_SERVICE_URL": ml_url,
                  },
              ),
          ]

          for source, target, replacements in configs:
              if target.exists():
                  raise SystemExit(f"Refusing to overwrite: {target}")

              text = source.read_text(encoding="utf-8")

              for placeholder, value in replacements.items():
                  if text.count(placeholder) != 1:
                      raise SystemExit(
                          f"Unexpected placeholder count for {placeholder} in {source}"
                      )
                  text = text.replace(placeholder, value, 1)

              tomllib.loads(text)
              target.write_text(text, encoding="utf-8")
              print(f"Rendered and parsed: {target}")
          PY

      - name: Dry-run production Worker builds
        run: |
          npx wrangler deploy \
            --dry-run \
            --config workers/etl-orchestrator/wrangler.production.toml

          npx wrangler deploy \
            --dry-run \
            --config workers/submission-ingress/wrangler.production.toml

      - name: Deploy production Workers with protected secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON: ${{ secrets.CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PARSER_SERVICE_AUTH_TOKEN: ${{ secrets.PARSER_SERVICE_AUTH_TOKEN }}
          ML_SERVICE_AUTH_TOKEN: ${{ secrets.ML_SERVICE_AUTH_TOKEN }}
          SUBMISSION_HMAC_KEY_V1: ${{ secrets.SUBMISSION_HMAC_KEY_V1 }}
          INGRESS_INTERNAL_AUTH_TOKEN: ${{ secrets.INGRESS_INTERNAL_AUTH_TOKEN }}
          IDENTITY_HMAC_KEY_V1: ${{ secrets.IDENTITY_HMAC_KEY_V1 }}
          ORCHESTRATOR_INTERNAL_AUTH_TOKEN: ${{ secrets.ORCHESTRATOR_INTERNAL_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          INGRESS_SECRETS="$RUNNER_TEMP/hirebeat-ingress-production-secrets.json"
          ORCHESTRATOR_SECRETS="$RUNNER_TEMP/hirebeat-orchestrator-production-secrets.json"

          cleanup() {
            rm -f "$INGRESS_SECRETS" "$ORCHESTRATOR_SECRETS"
          }
          trap cleanup EXIT

          export INGRESS_SECRETS ORCHESTRATOR_SECRETS

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ingress = {
              "SUBMISSION_HMAC_KEY_V1": os.environ["SUBMISSION_HMAC_KEY_V1"],
              "INGRESS_INTERNAL_AUTH_TOKEN": os.environ["INGRESS_INTERNAL_AUTH_TOKEN"],
              "GOOGLE_SERVICE_ACCOUNT_JSON": os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"],
              "CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON": os.environ[
                  "CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON"
              ],
              "PARSER_SERVICE_AUTH_TOKEN": os.environ["PARSER_SERVICE_AUTH_TOKEN"],
          }

          orchestrator = {
              "ML_SERVICE_AUTH_TOKEN": os.environ["ML_SERVICE_AUTH_TOKEN"],
              "CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON": os.environ[
                  "CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON"
              ],
              "IDENTITY_HMAC_KEY_V1": os.environ["IDENTITY_HMAC_KEY_V1"],
              "ORCHESTRATOR_INTERNAL_AUTH_TOKEN": os.environ[
                  "ORCHESTRATOR_INTERNAL_AUTH_TOKEN"
              ],
          }

          for path, values in [
              (Path(os.environ["INGRESS_SECRETS"]), ingress),
              (Path(os.environ["ORCHESTRATOR_SECRETS"]), orchestrator),
          ]:
              path.write_text(
                  json.dumps(values, separators=(",", ":")),
                  encoding="utf-8",
              )
              path.chmod(0o600)
          PY

          npx wrangler deploy \
            --strict \
            --config workers/etl-orchestrator/wrangler.production.toml \
            --secrets-file "$ORCHESTRATOR_SECRETS" \
            --message "Production ETL deployment from ${GITHUB_SHA}"

          npx wrangler deploy \
            --strict \
            --config workers/submission-ingress/wrangler.production.toml \
            --secrets-file "$INGRESS_SECRETS" \
            --message "Production Ingress deployment from ${GITHUB_SHA}"

      - name: Remove generated production files
        if: always()
        run: |
          rm -f \
            workers/submission-ingress/wrangler.production.toml \
            workers/etl-orchestrator/wrangler.production.toml
