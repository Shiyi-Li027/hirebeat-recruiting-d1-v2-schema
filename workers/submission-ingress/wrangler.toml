name = "hirebeat-submission-ingress-v1"
main = "src/index.ts"
compatibility_date = "2026-08-18"
# Staging currently has no Cloudflare-managed domain. Expose only the stable
# workers.dev target for authenticated Airtable/Google integration testing.
# Production must override this to false and use a reviewed custom domain.
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "hirebeat_recruiting_d1_v2"
database_id = "6c4275ca-faf3-4cba-867c-8ce807c30fc6"
migrations_dir = "../../migrations"
migrations_table = "d1_migrations"

[[r2_buckets]]
binding = "hirebeat_hr_raw_resumes_pdf_r2_v1"
bucket_name = "hirebeat-hr-raw-resumes-pdf-r2-v1"

[[queues.producers]]
binding = "INTAKE_QUEUE"
queue = "hirebeat-submission-intake-stg-v1"

[[queues.consumers]]
queue = "hirebeat-submission-intake-stg-v1"
dead_letter_queue = "hirebeat-submission-intake-dlq-stg-v1"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 4
retry_delay = 30

[[queues.consumers]]
queue = "hirebeat-submission-intake-dlq-stg-v1"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2

[vars]
DEPLOYMENT_STAGE = "staging"
SOURCE_SCHEMA_VERSION = "canonical-intake-v1"
SUBMISSION_UUID_NAMESPACE = "676628aa-0c13-4b8f-9dc1-3d675f7487a2"
PARSER_SERVICE_URL = "https://hirebeat-resume-parser-stg-340548608366.us-east1.run.app"
# This config is staging-only. Production configuration must omit or disable it.
ENABLE_STAGING_FAULT_INJECTION = "enabled"

# Set these with `wrangler secret put --config workers/submission-ingress/wrangler.toml`:
# SUBMISSION_HMAC_KEY_V1
# INGRESS_INTERNAL_AUTH_TOKEN
# GOOGLE_SERVICE_ACCOUNT_JSON
# CLOUD_RUN_INVOKER_SERVICE_ACCOUNT_JSON
# PARSER_SERVICE_AUTH_TOKEN
